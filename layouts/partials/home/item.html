{{- /* One education / experience entry: logo, title, date, details. */ -}}
<article class="item{{ if .logo }} has-logo{{ end }}">
  {{- with .logo }}<img class="org-logo{{ if $.logo_mono }} mono{{ end }}" src="{{ . | relURL }}" alt="" width="64" height="64" loading="lazy">{{ end }}
  <div>
    <div class="head"><h3>{{ .title }}</h3><time>{{ .date }}</time></div>
    <p class="meta">{{ .meta }}</p>
    {{- with .summary }}<p>{{ . | markdownify }}</p>{{ end }}
    {{- with .highlight }}<p>{{ . }}</p>{{ end }}
  </div>
</article>
