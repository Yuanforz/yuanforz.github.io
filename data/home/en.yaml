research:
  - title: "Westlake University · ENCODE Lab"
    logo: "img/home/westlake.png"
    date: "Jun 2026 – Present"
    meta: "Visiting Research Intern · Advisor: Prof. Huan Wang"
    summary: >-
      Ongoing project: investigating whether a vision model learns better
      representations when it is given the **freedom to actively decide where
      to look next**, rather than being fed a fixed set of crops. Implemented
      the training framework (DINO-style self-distillation on a block-causal
      ViT with an acquisition head); currently evaluating it on ImageNet.
  - title: "RoboMaster Global Robotics Competition"
    logo: "img/home/langya.png"
    logo_mono: true
    date: "Oct 2023 – Aug 2025"
    meta: "Vision Algorithm Member · Langya Algorithm Group, HUST"
    summary: >-
      Built the real-time **auto-aiming vision pipeline** in C++. Trained,
      quantized and deployed YOLO11-s on an Intel NUC with OpenVINO.

